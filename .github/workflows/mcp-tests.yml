name: MCP regression tests

on:
  workflow_dispatch:
  push:
    branches: [fix/mcp-hardening]
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/mcp-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      # AGIX 1.11.1 ya incluye las correcciones de Qualia, por lo que no se
      # parchea el paquete instalado. Si requirements.txt vuelve a fijar una
      # versión sin ellas, el contrato siguiente falla con un mensaje claro.
      - name: Verify AGIX dependency contract
        run: python -m pytest tests/test_dependency_contract.py -q
      - name: Run regression suite
        run: python -m pytest tests -q
