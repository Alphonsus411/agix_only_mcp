name: MCP regression tests

on:
  workflow_dispatch:
  push:
    branches: [fix/mcp-hardening]
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/mcp-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply reviewed AGIX source patch in isolated CI environment
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import subprocess

          spec = importlib.util.find_spec("agix")
          if spec is None or not spec.submodule_search_locations:
              raise SystemExit("AGIX no está instalado")
          package_dir = pathlib.Path(next(iter(spec.submodule_search_locations)))
          site_packages = package_dir.parent
          patch = pathlib.Path("patches/qualia-fixes.patch").resolve()
          # El parche usa rutas a/src/agix/...; -p2 las convierte en agix/...
          cmd = ["git", "apply", "-p2", "--check", str(patch)]
          subprocess.run(cmd, cwd=site_packages, check=True)
          subprocess.run(["git", "apply", "-p2", str(patch)], cwd=site_packages, check=True)
          print(f"AGIX CI patch applied to {package_dir}")
          PY
      - name: Verify AGIX dependency contract
        run: python -m pytest tests/test_dependency_contract.py -q
      - name: Run regression suite
        run: python -m pytest tests -q
